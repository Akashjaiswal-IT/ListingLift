services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    container_name: peshkar-mongodb

    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: peshkar

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: peshkar-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
