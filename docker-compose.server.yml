name: peshkar-server

services:
  # ─────────────────────────────────────────────
  # API Server (Express + tRPC)
  # ─────────────────────────────────────────────
  api-service:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.production
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    networks:
      - internal
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────
  # Background Worker (BullMQ)
  # ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env.production
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
    networks:
      - internal
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # MongoDB (with persistent volume)
  # ─────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: peshkar-mongodb
    env_file: .env.production
    volumes:
      - peshkar_mongo_data:/data/db
      - peshkar_mongo_config:/data/configdb
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # No ports exposed to host — only accessible within internal network

  # ─────────────────────────────────────────────
  # Redis (BullMQ queues + caching, with AOF persistence)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: peshkar-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - peshkar_redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # No ports exposed to host — only accessible within internal network

  # ─────────────────────────────────────────────
  # Caddy (Reverse Proxy → API, exposed via Traefik)
  # ─────────────────────────────────────────────
  caddy:
    image: caddy:latest
    container_name: peshkar-caddy
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.peshkar-router.rule=Host(`api.peshkarai.in`)"
      - "traefik.http.services.peshkar-router.loadbalancer.server.port=80"
      - "traefik.http.routers.peshkar-router.entrypoints=websecure"
      - "traefik.docker.network=peshkar-network"
      - "traefik.http.routers.peshkar-router.tls=true"
      - "traefik.http.routers.peshkar-router.tls.certresolver=cert-resolver"
    networks:
      - peshkar-network
      - internal
    depends_on:
      api-service:
        condition: service_healthy
    restart: unless-stopped

# ─────────────────────────────────────────────
# Named Volumes (data persists across restarts & updates)
# ─────────────────────────────────────────────
volumes:
  peshkar_mongo_data:
    name: peshkar_mongo_data
  peshkar_mongo_config:
    name: peshkar_mongo_config
  peshkar_redis_data:
    name: peshkar_redis_data

# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  internal:
    driver: bridge
  peshkar-network:
    external: true
