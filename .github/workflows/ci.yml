name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Build all packages
        run: pnpm turbo run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_bGlzdGluZ2xpZnQuY2xlcmsuYWNjb3VudHMuZGV2JA==
          CLERK_SECRET_KEY: sk_test_mocksecretkeyforlocaldev123456789
          MONGODB_URI: mongodb://localhost:27017/listinglift
          REDIS_URL: redis://localhost:6379
